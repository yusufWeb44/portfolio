<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yousef Ayoubi — Full-Stack Developer & Software Engineer. Building scalable web applications, custom CRM systems, and high-performance APIs." />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var varsStr = localStorage.getItem('portfolio_theme_vars');
          if (varsStr) {
            var vars = JSON.parse(varsStr);
            for (var k in vars) {
              document.documentElement.style.setProperty(k, vars[k]);
            }
          }
          var settStr = localStorage.getItem('portfolio_settings');
          if (settStr) {
            var sett = JSON.parse(settStr);
            if (sett && sett.profilePhoto) {
              var photoUrl = sett.profilePhoto;
              if (!photoUrl.startsWith('http://') && !photoUrl.startsWith('https://')) {
                photoUrl = (window.location.port === '5173' ? 'http://localhost:5000' : '') + (photoUrl.startsWith('/') ? '' : '/') + photoUrl;
              }
              var pLink = document.createElement('link');
              pLink.rel = 'preload';
              pLink.as = 'image';
              pLink.href = photoUrl;
              pLink.type = 'image/webp';
              pLink.setAttribute('fetchpriority', 'high');
              document.head.appendChild(pLink);
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Critical inline CSS: prevents white flash before stylesheets load -->
    <style>
      html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      html.dark{background-color:#0a0a0a;color:#ededed}
      html:not(.dark){background-color:#f4f6f8;color:#111827}
      body{margin:0}
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/portfolio_photo.webp" type="image/webp" fetchpriority="high" />
    <link rel="preconnect" href="http://localhost:5000" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:5000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" />
    </noscript>
    <title>Yousef Ayoubi | Software Developer & Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
